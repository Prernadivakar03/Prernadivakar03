<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="220" fill="#0b0e0c" rx="10"/>
  <text x="24" y="34" font-family="Courier New, monospace" font-size="15" fill="#00ff66">$ language_mix --featured-repos</text>

  <!-- Python -->
  <text x="24" y="72" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">Python</text>
  <rect x="140" y="58" width="360" height="16" rx="4" fill="#1c2620"/>
  <rect x="140" y="58" width="252" height="16" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="510" y="71" font-family="Courier New, monospace" font-size="12" fill="#c9ffd8">70%</text>

  <!-- JavaScript -->
  <text x="24" y="112" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">JavaScript</text>
  <rect x="140" y="98" width="360" height="16" rx="4" fill="#1c2620"/>
  <rect x="140" y="98" width="90" height="16" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="510" y="111" font-family="Courier New, monospace" font-size="12" fill="#c9ffd8">25%</text>

  <!-- HTML -->
  <text x="24" y="152" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">HTML</text>
  <rect x="140" y="138" width="360" height="16" rx="4" fill="#1c2620"/>
  <rect x="140" y="138" width="18" height="16" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="510" y="151" font-family="Courier New, monospace" font-size="12" fill="#c9ffd8">5%</text>

  <text x="24" y="196" font-family="Courier New, monospace" font-size="11" fill="#5a655e">based on featured repositories · updated manually</text>
</svg>
