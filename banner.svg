<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="#050608"/>
  <ellipse cx="180" cy="60" rx="260" ry="140" fill="url(#glowGreen)"/>
  <ellipse cx="850" cy="220" rx="260" ry="140" fill="url(#glowRed)"/>

  <!-- faint scanlines -->
  <g opacity="0.06">
    <line x1="0" y1="10" x2="1000" y2="10" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="30" x2="1000" y2="30" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="50" x2="1000" y2="50" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="70" x2="1000" y2="70" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="90" x2="1000" y2="90" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="230" x2="1000" y2="230" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="250" x2="1000" y2="250" stroke="#00ff66" stroke-width="1"/>
    <line x1="0" y1="270" x2="1000" y2="270" stroke="#00ff66" stroke-width="1"/>
  </g>

  <!-- terminal window -->
  <rect x="40" y="30" width="920" height="220" rx="10" fill="#0b0e0c" stroke="#1c2620" stroke-width="1.5"/>
  <rect x="40" y="30" width="920" height="34" rx="10" fill="#111613"/>
  <circle cx="65" cy="47" r="6" fill="#ff1744"/>
  <circle cx="88" cy="47" r="6" fill="#3a3a3a"/>
  <circle cx="111" cy="47" r="6" fill="#00ff66"/>
  <text x="500" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#5a655e">prerna@root: ~/portfolio</text>

  <text x="70" y="120" font-family="Courier New, monospace" font-size="16" fill="#00ff66" filter="url(#blurGlow)">$ whoami</text>
  <text x="70" y="160" font-family="Courier New, monospace" font-size="42" font-weight="700" fill="url(#titleGrad)" filter="url(#blurGlow)">PRERNA DIVAKAR</text>
  <text x="70" y="195" font-family="Courier New, monospace" font-size="17" fill="#8fffb0">Data Science &amp; ML Engineer // in progress</text>
  <text x="70" y="225" font-family="Courier New, monospace" font-size="14" fill="#ff5c7a">[ status: online ] [ mode: build ] [ focus: data → models → dashboards ]</text>
</svg>
