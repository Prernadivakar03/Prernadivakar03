<svg width="1000" height="20" viewBox="0 0 1000 20" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00ff66" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8fff9e" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ff1744" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </linearGradient>
    <filter id="lineGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="9" width="1000" height="2" fill="url(#lineGrad)" filter="url(#lineGlow)"/>
</svg>
