<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="260" fill="#0b0e0c" rx="10"/>
  <text x="24" y="34" font-family="Courier New, monospace" font-size="15" fill="#00ff66">$ skillset --list</text>

  <!-- rows: label, pct -->
  <!-- Python 90 -->
  <text x="24" y="70" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">Python</text>
  <rect x="150" y="56" width="350" height="15" rx="4" fill="#1c2620"/>
  <rect x="150" y="56" width="315" height="15" rx="4" fill="url(#barGrad2)" filter="url(#glow2)"/>

  <!-- SQL 80 -->
  <text x="24" y="102" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">SQL / PostgreSQL</text>
  <rect x="150" y="88" width="350" height="15" rx="4" fill="#1c2620"/>
  <rect x="150" y="88" width="280" height="15" rx="4" fill="url(#barGrad2)" filter="url(#glow2)"/>

  <!-- ML 75 -->
  <text x="24" y="134" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">Machine Learning</text>
  <rect x="150" y="120" width="350" height="15" rx="4" fill="#1c2620"/>
  <rect x="150" y="120" width="262" height="15" rx="4" fill="url(#barGrad2)" filter="url(#glow2)"/>

  <!-- Django/React 70 -->
  <text x="24" y="166" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">Django / React</text>
  <rect x="150" y="152" width="350" height="15" rx="4" fill="#1c2620"/>
  <rect x="150" y="152" width="245" height="15" rx="4" fill="url(#barGrad2)" filter="url(#glow2)"/>

  <!-- Power BI 65 -->
  <text x="24" y="198" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">Power BI</text>
  <rect x="150" y="184" width="350" height="15" rx="4" fill="#1c2620"/>
  <rect x="150" y="184" width="227" height="15" rx="4" fill="url(#barGrad2)" filter="url(#glow2)"/>

  <!-- Git/GitHub 85 -->
  <text x="24" y="230" font-family="Courier New, monospace" font-size="13" fill="#8fffb0">Git &amp; GitHub</text>
  <rect x="150" y="216" width="350" height="15" rx="4" fill="#1c2620"/>
  <rect x="150" y="216" width="297" height="15" rx="4" fill="url(#barGrad2)" filter="url(#glow2)"/>

  <text x="24" y="250" font-family="Courier New, monospace" font-size="11" fill="#5a655e">self-assessed proficiency</text>
</svg>
